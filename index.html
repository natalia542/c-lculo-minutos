function totalMin(a) {
  let t = a.bienvenida + a.pag_clase*7.5 + a.conclusion + a.complementarios;
  (a.units_data||[]).forEach(u => { t += u.orient+u.videoClase+u.infografia+u.biblio+u.formativo+u.sumativo; });
  return t + a.examen;
}
function tgt(a) { return (a.h_async+a.h_apoyo)*HP; }
function pc(a) { const g=tgt(a); return g>0?totalMin(a)/g*100:0; }

function suggestedPag(a) {
  let sinCC = a.bienvenida + a.conclusion + a.complementarios + a.examen;
  (a.units_data||[]).forEach(u => { sinCC += u.orient+u.videoClase+u.infografia+u.biblio+u.formativo+u.sumativo; });
  const needed = tgt(a) - sinCC;
  return Math.max(0, Math.ceil(needed / 7.5));
}

function mkUnits(n) {
  const u = [];
  for(let i=0;i<n;i++) u.push({...DEFUNIT});
