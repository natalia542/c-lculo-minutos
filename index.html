<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HACKEA — Calculadora de Recursos v2</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

<style>

body{background:#FAFAFA;font-family:'Poppins',sans-serif;color:#2A2A2A}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

<body>
<div id="root"></div>
<script>
/* ============================================================
   HACKEA · Calculadora de Recursos v2
   Etapa 1 — motor de cálculo + Asignaturas + Minutos de consumo
   ============================================================ */

var useState = React.useState, useMemo = React.useMemo,
    useCallback = React.useCallback, useEffect = React.useEffect,
    useRef = React.useRef;
var h = React.createElement;

/* ---------- Supabase ---------- */
var SUPABASE_URL = "https://uiqktoskdpnvpysibgqm.supabase.co";
var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpcWt0b3NrZHBudnB5c2liZ3FtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0ODc3MTQsImV4cCI6MjA5MzA2MzcxNH0.57fXlTos-fU9gAU6jtDI3UJhIb-Da9BoJvxD8PQ-9O4";
var sbEnabled = SUPABASE_URL.indexOf("TU_URL") !== 0;
var sb = sbEnabled ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

/* ---------- Configuración global (editable en pantalla) ---------- */
var CFG_KEY = "hackea_calc_cfg_v2";
var DEF_CFG = {
  minProd: 60,        // hora de producción — lo comprometido con el docente
  minPed: 40,         // hora pedagógica — referencia contractual
  minPag: 7.5,        // minutos por página / pantalla de lectura
  pantPorPag: 1,      // pantallas de Rise por página producida
  usdPorPag: 1        // costo interno por página
};
function loadCfg() {
  try {
    var raw = localStorage.getItem(CFG_KEY);
    if (!raw) return Object.assign({}, DEF_CFG);
    return Object.assign({}, DEF_CFG, JSON.parse(raw));
  } catch (e) { return Object.assign({}, DEF_CFG); }
}
function saveCfg(c) {
  try { localStorage.setItem(CFG_KEY, JSON.stringify(c)); } catch (e) {}
}

/* ---------- Plantilla estándar de unidad ---------- */
/* La clase escrita NO es un recurso de la unidad: es transversal.
   Su tiempo, en cambio, sí tributa a cada unidad (se calcula como el
   resto del tiempo disponible de esa unidad). */
var TPL = [
  { nombre: "Orientaciones de la unidad", min: 5,  presup: "async" },
  { nombre: "Videoclase",                 min: 15, presup: "async" },
  { nombre: "Recurso interactivo",        min: 15, presup: "async" },
  { nombre: "Foro",                       min: 30, presup: "async" },
  { nombre: "Bibliografía obligatoria",   min: 60, presup: "info"  },
  { nombre: "Evaluación formativa",       min: 15, presup: "sinc"  },
  { nombre: "Evaluación sumativa",        min: 60, presup: "sinc"  }
];
function mkUnit() {
  return {
    pag_manual: null,
    recursos: TPL.map(function (r) { return { nombre: r.nombre, min: r.min, presup: r.presup }; })
  };
}
function num(v, d) { var n = Number(v); return isNaN(n) ? d : n; }

/* ---------- Migración del formato antiguo ---------- */
function migrateUnit(u) {
  if (u && Array.isArray(u.recursos)) {
    return {
      pag_manual: (u.pag_manual === null || u.pag_manual === undefined || u.pag_manual === "") ? null : Number(u.pag_manual),
      recursos: u.recursos.map(function (r) {
        return { nombre: r.nombre, min: num(r.min, 0), presup: r.presup || "async" };
      })
    };
  }
  var o = u || {};
  return {
    pag_manual: null,
    recursos: [
      { nombre: "Orientaciones de la unidad", min: num(o.orient, 5),      presup: "async" },
      { nombre: "Videoclase",                 min: num(o.videoClase, 15), presup: "async" },
      { nombre: "Recurso interactivo",        min: num(o.infografia, 15), presup: "async" },
      { nombre: "Foro",                       min: 30,                    presup: "async" },
      { nombre: "Bibliografía obligatoria",   min: num(o.biblio, 60),     presup: "info"  },
      { nombre: "Evaluación formativa",       min: num(o.formativo, 15),  presup: "sinc"  },
      { nombre: "Evaluación sumativa",        min: num(o.sumativo, 60),   presup: "sinc"  }
    ]
  };
}
function migrateAsig(a) {
  var uds = a.units_data;
  if (typeof uds === "string") { try { uds = JSON.parse(uds); } catch (e) { uds = []; } }
  if (!Array.isArray(uds)) uds = [];
  var n = num(a.uni, uds.length) || uds.length || 1;
  var out = [];
  for (var i = 0; i < n; i++) out.push(uds[i] ? migrateUnit(uds[i]) : mkUnit());
  return Object.assign({}, a, {
    uni: n,
    bienvenida: num(a.bienvenida, 0),
    conclusion: num(a.conclusion, 0),
    complementarios: num(a.complementarios, 0),
    examen: num(a.examen, 0),
    h_async: num(a.h_async, 0),
    h_apoyo: num(a.h_apoyo, 0),
    units_data: out
  });
}

/* ---------- MOTOR DE CÁLCULO ---------- */
function calc(a, cfg) {
  var uds = a.units_data || [];
  var n = uds.length || 1;

  var presupProd = a.h_async * cfg.minProd;   // base de producción (60')
  var presupPed  = a.h_async * cfg.minPed;    // referencia contractual (40')
  var presupSinc = a.h_apoyo * cfg.minPed;    // acompañamiento (40')
  var minPorUnidad = presupProd / n;

  var unidades = uds.map(function (u) {
    var fijo = 0, sinc = 0, info = 0;
    (u.recursos || []).forEach(function (r) {
      var m = num(r.min, 0);
      if (r.presup === "sinc") sinc += m;
      else if (r.presup === "info") info += m;
      else fijo += m;
    });
    var dispo = minPorUnidad - fijo;
    var pagAuto = Math.max(0, Math.round(dispo / cfg.minPag));
    var manual = (u.pag_manual === null || u.pag_manual === undefined || u.pag_manual === "");
    var pag = manual ? pagAuto : Math.max(0, num(u.pag_manual, pagAuto));
    var minCC = pag * cfg.minPag;
    return {
      fijo: fijo, sinc: sinc, info: info, dispo: dispo,
      pagAuto: pagAuto, pag: pag, manual: !manual,
      minCC: minCC, totalAsync: fijo + minCC
    };
  });

  var transv = num(a.bienvenida, 0) + num(a.conclusion, 0) + num(a.complementarios, 0);
  var fijoUnid = 0, minCC = 0, pagTot = 0, sincUnid = 0, infoTot = 0;
  unidades.forEach(function (u) {
    fijoUnid += u.fijo; minCC += u.minCC; pagTot += u.pag;
    sincUnid += u.sinc; infoTot += u.info;
  });

  var consumoAsync = transv + fijoUnid + minCC;
  var consumoSinc = sincUnid + num(a.examen, 0);

  var excesoMin = consumoAsync - presupPed;
  var excesoPag = excesoMin / cfg.minPag;

  return {
    n: n, unidades: unidades,
    minPorUnidad: minPorUnidad,
    transv: transv, fijoUnid: fijoUnid, minCC: minCC,
    pagTot: pagTot, pantTot: pagTot * cfg.pantPorPag,
    consumoAsync: consumoAsync, consumoSinc: consumoSinc, infoTot: infoTot,
    presupProd: presupProd, presupPed: presupPed, presupSinc: presupSinc,
    pctProd: presupProd ? consumoAsync / presupProd * 100 : 0,
    pctPed:  presupPed  ? consumoAsync / presupPed  * 100 : 0,
    pctSinc: presupSinc ? consumoSinc  / presupSinc * 100 : 0,
    excesoMin: excesoMin,
    excesoHrsPed: excesoMin / cfg.minPed,
    excesoPag: excesoPag,
    excesoUsd: excesoPag * cfg.usdPorPag,
    totalEstudiante: consumoAsync + consumoSinc + infoTot
  };
}

/* ---------- Datos de respaldo (si no hay Supabase) ---------- */
var FALLBACK = [
  { id: 1, prog: "MBA", ciclo: 1, nombre: "Taller de emprendimiento", uni: 4, h_async: 15, h_apoyo: 12,
    doc: "Vanessa Nowak", bienvenida: 3, pag_clase: 0, conclusion: 2, complementarios: 0, examen: 60, units_data: [] },
  { id: 2, prog: "MPCG", ciclo: 2, nombre: "Control de gestión", uni: 4, h_async: 12, h_apoyo: 12,
    doc: "Por confirmar", bienvenida: 3, pag_clase: 0, conclusion: 2, complementarios: 0, examen: 60, units_data: [] }
];

var PCOL = { MBA: "#0090F8", MCG: "#404040", MPCG: "#404040", MCEE: "#0090F8", OPT: "#666" };
var C = { azul: "#0090F8", texto: "#2A2A2A", cuerpo: "#404040", fondo: "#EBECF0", claro: "#F3F3F3" };

/* ---------- Componentes chicos ---------- */
function N(p) {
  return h("input", {
    type: "number", value: (p.v === null || p.v === undefined) ? "" : p.v,
    placeholder: p.ph || "",
    onChange: function (e) { p.onChange(e.target.value === "" ? null : Number(e.target.value)); },
    style: {
      width: p.w || 52, border: "1px solid " + (p.accent ? C.azul : "#ddd"), borderRadius: 4,
      padding: "3px 4px", fontSize: 12, textAlign: "right",
      background: p.accent ? "#F0F8FF" : "#fff", fontFamily: "inherit",
      fontWeight: p.accent ? 600 : 400
    }
  });
}
function Tx(p) {
  return h("input", {
    type: "text", value: p.v || "",
    onChange: function (e) { p.onChange(e.target.value); },
    style: { width: p.w || 120, border: "1px solid #ddd", borderRadius: 4, padding: "3px 6px", fontSize: 12, fontFamily: "inherit" }
  });
}
function Pill(p) {
  return h("span", { style: { fontSize: 9, color: "#fff", background: PCOL[p.prog] || "#888", borderRadius: 3, padding: "2px 6px", fontWeight: 700, whiteSpace: "nowrap" } }, p.prog);
}
/* Semáforo del presupuesto de producción y del síncrono */
function Badge(p) {
  var bg = "#D1FAE5", fg = "#065F46", lb = "OK ";
  if (p.p < 95) { bg = "#FEE2E2"; fg = "#991B1B"; lb = "Bajo "; }
  else if (p.p > 115) { bg = "#FEF3C7"; fg = "#92400E"; lb = "Excede "; }
  return h("span", { style: { background: bg, color: fg, padding: "2px 8px", borderRadius: 12, fontSize: 11, fontWeight: 600, whiteSpace: "nowrap" } }, lb + p.p.toFixed(0) + "%");
}
/* Indicador neutro: la referencia contractual siempre va a exceder,
   no es una alerta sino el dato que se quiere visibilizar */
function BadgeRef(p) {
  return h("span", { style: { background: "#EEF2F7", color: "#475569", padding: "2px 8px", borderRadius: 12, fontSize: 11, fontWeight: 600, whiteSpace: "nowrap", border: "1px solid #DDE3EC" } }, p.p.toFixed(0) + "%");
}
/* Los optativos no tienen horas de acompañamiento: no corresponde
   mostrar 0%, sino advertir que las evaluaciones no tienen dónde cargarse */
function BadgeSinc(p) {
  if (p.presup > 0) return h(Badge, { p: p.p });
  if (p.consumo > 0) return h("span", { style: { background: "#FEF3C7", color: "#92400E", padding: "2px 8px", borderRadius: 12, fontSize: 10, fontWeight: 600, whiteSpace: "nowrap" } }, "Sin horas");
  return h("span", { style: { color: "#ccc", fontSize: 11 } }, "\u2014");
}
function Bar(p) {
  var col = p.p < 95 ? "#EF4444" : (p.p <= 115 ? C.azul : "#F59E0B");
  if (p.neutro) col = "#94A3B8";
  return h("div", { style: { height: 6, background: C.fondo, borderRadius: 3, position: "relative", margin: "4px 0", minWidth: 70 } },
    h("div", { style: { width: (Math.min(p.p, 160) / 1.6) + "%", height: "100%", background: col, borderRadius: 3, transition: "width .3s" } }),
    h("div", { style: { position: "absolute", left: (100 / 1.6) + "%", top: -2, width: 2, height: 10, background: C.texto, opacity: .25, borderRadius: 1 } })
  );
}
function hm(min) {
  var m = Math.round(min);
  var hh = Math.floor(m / 60), mm = m % 60;
  if (hh === 0) return mm + " min";
  return hh + " h" + (mm ? " " + mm + " min" : "");
}

/* ---------- App ---------- */
function App() {
  var st = useState([]); var data = st[0], setData = st[1];
  var l = useState(true); var loading = l[0], setLoading = l[1];
  var t = useState(0); var tab = t[0], setTab = t[1];
  var fp = useState("Todos"); var fProg = fp[0], setFProg = fp[1];
  var fc = useState("Todos"); var fCiclo = fc[0], setFCiclo = fc[1];
  var op = useState(null); var open = op[0], setOpen = op[1];
  var sv = useState(false); var saving = sv[0], setSaving = sv[1];
  var cf = useState(loadCfg()); var cfg = cf[0], setCfg = cf[1];
  var cp = useState(false); var cfgOpen = cp[0], setCfgOpen = cp[1];
  var vi = useState("interna"); var vista = vi[0], setVista = vi[1];
  var saveTimer = useRef(null);

  useEffect(function () {
    function load() {
      if (!sb) { setData(FALLBACK.map(migrateAsig)); setLoading(false); return; }
      sb.from("asignaturas").select("*").order("ciclo").order("prog").order("id").then(function (res) {
        var rows = res.data;
        if (res.error || !rows || !rows.length) setData(FALLBACK.map(migrateAsig));
        else setData(rows.map(migrateAsig));
        setLoading(false);
      });
    }
    load();
  }, []);

  useEffect(function () { saveCfg(cfg); }, [cfg]);

  var saveToDb = useCallback(function (rec) {
    if (!sb) return;
    setSaving(true);
    var r = calc(rec, cfg);
    var payload = {
      prog: rec.prog, ciclo: rec.ciclo, nombre: rec.nombre, doc: rec.doc,
      uni: rec.uni, h_async: rec.h_async, h_apoyo: rec.h_apoyo,
      bienvenida: rec.bienvenida, conclusion: rec.conclusion,
      complementarios: rec.complementarios, examen: rec.examen,
      pag_clase: r.pagTot, units_data: rec.units_data,
      updated_at: new Date().toISOString()
    };
    sb.from("asignaturas").update(payload).eq("id", rec.id).then(function () { setSaving(false); });
  }, [cfg]);

  var upd = useCallback(function (id, fn) {
    setData(function (d) {
      var next = d.map(function (a) {
        if (a.id !== id) return a;
        var copy = Object.assign({}, a, {
          units_data: (a.units_data || []).map(function (u) {
            return { pag_manual: u.pag_manual, recursos: u.recursos.map(function (r) { return Object.assign({}, r); }) };
          })
        });
        return fn(copy);
      });
      var ch = next.filter(function (a) { return a.id === id; })[0];
      if (ch && sb) {
        clearTimeout(saveTimer.current);
        saveTimer.current = setTimeout(function () { saveToDb(ch); }, 1500);
      }
      return next;
    });
  }, [saveToDb]);

  function setUnidades(x, v) {
    var n = Math.max(1, num(v, 1));
    var d = n - x.units_data.length;
    if (d > 0) for (var i = 0; i < d; i++) x.units_data.push(mkUnit());
    if (d < 0) x.units_data = x.units_data.slice(0, n);
    x.uni = n;
    return x;
  }

  var filtered = useMemo(function () {
    return data.filter(function (a) {
      return (fProg === "Todos" || a.prog === fProg) && (fCiclo === "Todos" || a.ciclo === Number(fCiclo));
    });
  }, [data, fProg, fCiclo]);

  var progs = [];
  data.forEach(function (a) { if (progs.indexOf(a.prog) < 0) progs.push(a.prog); });
  var ciclos = [];
  data.forEach(function (a) { if (ciclos.indexOf(a.ciclo) < 0) ciclos.push(a.ciclo); });
  ciclos.sort();

  if (loading) return h("div", { style: { textAlign: "center", padding: 80, color: "#999", fontSize: 14 } }, "Cargando datos...");

  var interna = vista === "interna";

  /* ---------- Cabecera ---------- */
  var header = h("div", { style: { display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14, flexWrap: "wrap", gap: 8 } },
    h("div", { style: { display: "flex", alignItems: "center", gap: 10 } },
      h("div", { style: { width: 32, height: 32, borderRadius: "50%", border: "2.5px solid " + C.azul, display: "flex", alignItems: "center", justifyContent: "center" } },
        h("div", { style: { width: 8, height: 8, borderRadius: "50%", border: "2px solid " + C.azul } })),
      h("div", null,
        h("span", { style: { fontSize: 17, fontWeight: 700, color: C.texto, letterSpacing: .5 } }, "HACK", h("span", { style: { color: C.azul } }, "EA")),
        h("span", { style: { fontSize: 11, color: "#999", marginLeft: 8 } }, "Calculadora de Recursos v2"))),
    h("div", { style: { display: "flex", alignItems: "center", gap: 10, fontSize: 11 } },
      h("div", { style: { display: "flex", border: "1px solid #ddd", borderRadius: 6, overflow: "hidden" } },
        ["interna", "universidad"].map(function (v) {
          return h("button", {
            key: v, onClick: function () { setVista(v); },
            style: {
              padding: "4px 10px", fontSize: 11, border: "none", cursor: "pointer", fontFamily: "inherit",
              background: vista === v ? C.azul : "#fff", color: vista === v ? "#fff" : "#888", fontWeight: vista === v ? 600 : 400
            }
          }, v === "interna" ? "Vista Hackea" : "Vista Universidad");
        })),
      h("button", { onClick: function () { setCfgOpen(!cfgOpen); }, style: { background: "none", border: "1px solid #ddd", borderRadius: 6, padding: "4px 10px", fontSize: 11, cursor: "pointer", color: "#666", fontFamily: "inherit" } }, "Parámetros"),
      h("span", { style: { color: saving ? C.azul : "#ccc" } }, saving ? "Guardando..." : (sbEnabled ? "Conectado" : "Modo local")))
  );

  /* ---------- Panel de parámetros ---------- */
  function cfgRow(label, key, sufijo, nota) {
    return h("div", { style: { display: "flex", alignItems: "center", gap: 8, fontSize: 12, marginBottom: 6 } },
      h("span", { style: { width: 250, color: C.cuerpo } }, label),
      N({ v: cfg[key], w: 56, accent: true, onChange: function (v) { var c = Object.assign({}, cfg); c[key] = num(v, DEF_CFG[key]); setCfg(c); } }),
      h("span", { style: { color: "#888" } }, sufijo),
      nota ? h("span", { style: { color: "#aaa", fontSize: 11, marginLeft: 6 } }, nota) : null);
  }
  var panelCfg = cfgOpen ? h("div", { style: { background: "#fff", border: "1px solid " + C.fondo, borderRadius: 10, padding: 16, marginBottom: 14 } },
    h("div", { style: { fontSize: 13, fontWeight: 600, color: C.texto, marginBottom: 10 } }, "Parámetros de cálculo"),
    cfgRow("Hora de producción", "minProd", "min", "lo comprometido con el docente"),
    cfgRow("Hora pedagógica (referencia contractual)", "minPed", "min", "SCT / horas del programa"),
    cfgRow("Minutos por página o pantalla", "minPag", "min", "estándar de la Universidad"),
    cfgRow("Pantallas de Rise por página producida", "pantPorPag", "pantallas", "medir con una asignatura ya montada"),
    interna ? cfgRow("Costo por página (uso interno)", "usdPorPag", "USD", "no se muestra en vista Universidad") : null,
    h("div", { style: { fontSize: 11, color: "#888", marginTop: 8, borderTop: "1px solid #F0F0F0", paddingTop: 8 } },
      "La producción se dimensiona con la hora de " + cfg.minProd + " minutos. La referencia contractual mide ese mismo contenido contra la hora pedagógica de " + cfg.minPed + " minutos. La diferencia entre ambas es la sobreproducción que asume Hackea.")
  ) : null;

  /* ---------- Pestañas ---------- */
  var tabs = ["Asignaturas", "Minutos de consumo", "Páginas contenidista", "Costos", "Comparativa evaluaciones"];
  var navTabs = h("div", { style: { display: "flex", borderBottom: "2px solid " + C.fondo, marginBottom: 14, overflowX: "auto" } },
    tabs.map(function (tt, i) {
      return h("button", {
        key: i, onClick: function () { setTab(i); },
        style: {
          padding: "8px 18px", fontSize: 12, fontWeight: tab === i ? 600 : 400,
          color: tab === i ? C.azul : (i > 1 ? "#bbb" : "#999"),
          borderBottom: tab === i ? "2px solid " + C.azul : "2px solid transparent",
          background: "none", border: "none", cursor: "pointer", marginBottom: -2, fontFamily: "inherit", whiteSpace: "nowrap"
        }
      }, tt, i > 1 ? h("span", { style: { fontSize: 9, color: "#ccc", marginLeft: 4 } }, "·") : null);
    })
  );

  var filtros = h("div", { style: { display: "flex", gap: 10, marginBottom: 14, fontSize: 12, alignItems: "center", flexWrap: "wrap" } },
    h("select", { value: fProg, onChange: function (e) { setFProg(e.target.value); }, style: { padding: "4px 8px", borderRadius: 5, border: "1px solid #ddd", fontSize: 12, fontFamily: "inherit" } },
      h("option", { value: "Todos" }, "Todos los programas"),
      progs.map(function (p) { return h("option", { key: p, value: p }, p); })),
    h("select", { value: fCiclo, onChange: function (e) { setFCiclo(e.target.value); }, style: { padding: "4px 8px", borderRadius: 5, border: "1px solid #ddd", fontSize: 12, fontFamily: "inherit" } },
      h("option", { value: "Todos" }, "Todos los ciclos"),
      ciclos.map(function (c) { return h("option", { key: c, value: c }, "Ciclo " + c); })),
    h("span", { style: { color: "#aaa", marginLeft: "auto" } }, filtered.length + " asignaturas"));

  /* ================= TAB 0 · ASIGNATURAS ================= */
  function tabAsignaturas() {
    var totPag = 0, totExc = 0;
    filtered.forEach(function (a) { var r = calc(a, cfg); totPag += r.pagTot; totExc += r.excesoPag; });
    var cols = ["", "Asignatura", "Docente", "H asínc.", "H apoyo", "Unid.", "Pág/unidad", "Total pág.", "Pantallas", "Base " + cfg.minProd + "'", "Ref. contractual", "Síncrono"];
    return h("div", { style: { background: "#fff", borderRadius: 10, border: "1px solid " + C.fondo, overflow: "hidden" } },

              h("td", { style: { padding: "6px 8px" } }, h(Pill, { prog: a.prog }), h("br"), h("span", { style: { fontSize: 9, color: "#bbb" } }, "C" + a.ciclo)),

  /* ================= TAB 1 · MINUTOS DE CONSUMO ================= */
  function filaRecurso(a, ui, ri, rec) {

      h(Tx, { v: rec.nombre, w: "100%", onChange: function (v) { upd(a.id, function (x) { x.units_data[ui].recursos[ri].nombre = v; return x; }); } }),

  function medidor(titulo, sub, consumo, presup, pct, neutro) {

  function tabMinutos() {
    return filtered.map(function (a) {
      var r = calc(a, cfg);

      return h("div", { key: a.id, style: { background: "#fff", borderRadius: 10, border: "1px solid " + C.fondo, marginBottom: 8, overflow: "hidden" } },

          h(Pill, { prog: a.prog }),
          h("div", null,
            h("div", { style: { fontSize: 13, fontWeight: 500, color: C.texto } }, a.nombre),

            h("div", { style: { fontSize: 14, fontWeight: 700, color: C.texto } }, r.pagTot + " pág"),
            h("div", { style: { fontSize: 10, color: "#999" } }, Math.round(r.pantTot) + " pantallas")),
          h("div", null, h("div", { style: { fontSize: 9, color: "#aaa" } }, "Base " + cfg.minProd + "'"), h(Badge, { p: r.pctProd })),

        isO ? h("div", { style: { padding: "0 16px 16px", background: "#FAFBFF" } },

          /* Encabezado de parámetros */
          h("div", { style: { display: "flex", gap: 14, flexWrap: "wrap", alignItems: "center", fontSize: 12, margin: "4px 0 12px" } },
            h("label", { style: { display: "flex", alignItems: "center", gap: 4, color: "#666" } }, "Unidades",

            h("label", { style: { display: "flex", alignItems: "center", gap: 4, color: "#666" } }, "H apoyo",

            h("span", { style: { color: "#aaa", marginLeft: "auto", fontSize: 11 } },

          h("div", { style: { fontSize: 11, fontWeight: 600, color: C.azul, borderBottom: "1px solid #E0E7F0", paddingBottom: 3, marginBottom: 6 } }, "Recursos transversales"),

            h(N, { v: a.bienvenida, w: 48, onChange: function (v) { upd(a.id, function (x) { x.bienvenida = num(v, 0); return x; }); } }),

            "Se desarrolla como un solo documento continuo para toda la asignatura, no como un recurso de cada unidad. Su tiempo de lectura sí tributa a cada unidad: el detalle de más abajo indica cuántas páginas del documento corresponden a cada una.",

              h("div", { style: { fontSize: 11, fontWeight: 600, color: C.texto, borderBottom: "1px solid #eee", paddingBottom: 3, marginBottom: 4, display: "flex", justifyContent: "space-between" } },
                h("span", null, "Unidad " + (i + 1)),
                h("span", { style: { fontWeight: 400, color: "#aaa" } }, "Asíncrono " + hm(u.totalAsync) + " de " + hm(r.minPorUnidad) + "  ·  Síncrono " + hm(u.sinc))),
              (ud.recursos || []).map(function (rec, ri) { return filaRecurso(a, i, ri, rec); }),

              /* fila de clase escrita, calculada */
              h("div", { style: { display: "grid", gridTemplateColumns: "1fr 90px 56px 60px 22px", gap: "2px 8px", alignItems: "center", fontSize: 12, padding: "4px 0", borderTop: "1px dashed #E0E7F0", marginTop: 3 } },
                h("span", { style: { color: C.texto, fontWeight: 600 } }, "Clase escrita",
                  h("span", { style: { fontWeight: 400, color: "#999", fontSize: 10 } }, "  (transversal · páginas de esta unidad)")),
                h("span", { style: { fontSize: 10, color: "#aaa" } }, u.manual ? "manual" : "automático"),
                h(N, { v: ud.pag_manual, ph: String(u.pagAuto), w: 48, accent: true, onChange: function (v) { upd(a.id, function (x) { x.units_data[i].pag_manual = v; return x; }); } }),
                h("span", { style: { textAlign: "right", fontWeight: 600, color: C.azul } }, Math.round(u.minCC) + " min"),
                u.manual ? h("button", { onClick: function () { upd(a.id, function (x) { x.units_data[i].pag_manual = null; return x; }); }, title: "Volver al cálculo automático", style: { background: "none", border: "none", color: "#ccc", cursor: "pointer", fontSize: 12, fontFamily: "inherit" } }, "\u21BA") : h("span")),

              h("div", { style: { display: "flex", gap: 8, marginTop: 4 } },
                h("button", {
                  onClick: function () { upd(a.id, function (x) { x.units_data[i].recursos.push({ nombre: "Nuevo recurso", min: 15, presup: "async" }); return x; }); },
                  style: { background: "none", border: "1px dashed #cfd8e3", borderRadius: 5, padding: "3px 10px", fontSize: 10, color: "#8a94a6", cursor: "pointer", fontFamily: "inherit" }
                }, "+ Agregar recurso"),
                h("button", {
                  onClick: function () { upd(a.id, function (x) { x.units_data[i] = mkUnit(); return x; }); },
                  style: { background: "none", border: "1px dashed #cfd8e3", borderRadius: 5, padding: "3px 10px", fontSize: 10, color: "#8a94a6", cursor: "pointer", fontFamily: "inherit" }
                }, "Restaurar plantilla estándar")));
          }),

          /* Examen final */
          h("div", { style: { fontSize: 11, fontWeight: 600, color: C.texto, borderBottom: "1px solid #eee", paddingBottom: 3, marginBottom: 4, marginTop: 8 } }, "Examen final · síncrono"),
          h("div", { style: { display: "grid", gridTemplateColumns: "1fr 56px 60px", gap: "2px 8px", fontSize: 12, alignItems: "center", marginBottom: 12 } },
            h("span", { style: { color: "#666" } }, "Examen final"),
            h(N, { v: a.examen, w: 48, onChange: function (v) { upd(a.id, function (x) { x.examen = num(v, 0); return x; }); } }),
            h("span", { style: { textAlign: "right", color: "#888" } }, a.examen + " min")),

          /* Medidores */
          h("div", { style: { display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 10 } },
            medidor("Asíncrono · base de producción", "hora de " + cfg.minProd + " min", r.consumoAsync, r.presupProd, r.pctProd, false),
            medidor("Asíncrono · referencia contractual", "hora pedagógica de " + cfg.minPed + " min", r.consumoAsync, r.presupPed, r.pctPed, true),
            medidor("Síncrono · acompañamiento", "evaluaciones y examen · " + cfg.minPed + " min", r.consumoSinc, r.presupSinc, r.pctSinc, false)),

            h("div", { style: { color: "#94A3B8", fontSize: 11, marginTop: 4 } },

          /* Total del estudiante */

            h("b", { style: { color: C.texto } }, hm(r.totalEstudiante)))
        ) : null);
    });
  }

  /* ================= Pestañas pendientes ================= */
  function tabPendiente(nombre) {
    return h("div", { style: { background: "#fff", borderRadius: 10, border: "1px dashed #dde3ec", padding: 40, textAlign: "center" } },
      h("div", { style: { fontSize: 13, fontWeight: 600, color: C.texto, marginBottom: 6 } }, nombre),
      h("div", { style: { fontSize: 12, color: "#999", maxWidth: 460, margin: "0 auto", lineHeight: 1.5 } },
        "Se reconstruye en la Etapa 2, sobre el motor de cálculo nuevo. Los datos que edites ahora en Asignaturas y en Minutos de consumo ya quedan guardados y alimentan esta vista cuando esté lista."));
  }

  var contenido;
  if (tab === 0) contenido = tabAsignaturas();
  else if (tab === 1) contenido = tabMinutos();
  else if (tab === 2) contenido = tabPendiente("Páginas contenidista");
  else if (tab === 3) contenido = tabPendiente("Costos · uso interno de Hackea");
  else contenido = tabPendiente("Comparativa de evaluaciones");

  return h("div", { style: { maxWidth: 1240, margin: "0 auto", padding: "20px 16px", minHeight: "100vh" } },
    header, panelCfg, navTabs, filtros, contenido,
    h("div", { style: { marginTop: 24, textAlign: "center", fontSize: 10, color: "#ccc" } }, "HACKEA · info@hackea.pro"));
}
