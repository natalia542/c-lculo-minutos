/* ---------- Configuración ---------- */
var CFG_KEY = "hackea_calc_cfg_v2";
var DEF_CFG = {
  minProd: 60,       // hora de producción, lo comprometido con el docente
  minPed: 40,        // hora pedagógica, las horas del programa
  minPag: 7.5,       // minutos por página o pantalla
  pantPorPag: 1,     // pantallas de Rise por página producida
  pagMinUnidad: 16,  // piso de páginas por unidad
  usdPorPag: 1       // costo interno por página
};
function loadCfg() {
  try {
    var raw = localStorage.getItem(CFG_KEY);
    return raw ? Object.assign({}, DEF_CFG, JSON.parse(raw)) : Object.assign({}, DEF_CFG);
  } catch (e) { return Object.assign({}, DEF_CFG); }
}
function saveCfg(c) { try { localStorage.setItem(CFG_KEY, JSON.stringify(c)); } catch (e) {} }
function num(v, d) { var n = Number(v); return isNaN(n) ? d : n; }

/* ---------- Plantilla estándar de unidad ----------
   La clase escrita NO es recurso de la unidad: es transversal.
   Su tiempo si tributa a cada unidad (se calcula como el resto). */
/* Las descripciones se refrescan siempre desde aquí: no son editables
   en pantalla, así que se corrigen solas en los datos ya guardados */
var DESCS = {
  "Orientaciones de la unidad": "Audio que abre la unidad",
  "Videoclase": "Los temas centrales, explicados",
  "Recurso interactivo": "Interactivo con los temas destacados",
  "Foro": "Participación y discusión",
  "Bibliografía obligatoria": "Lecturas provistas por la Universidad",
  "Evaluación formativa": "Práctica con retroalimentación",
  "Evaluación sumativa": "Evaluación calificada de la unidad"
};
var MIN_FORM = [60, 90], MIN_SUM = [60, 90], MIN_EX = [90, 120];
var TPL = [
  { nombre: "Orientaciones de la unidad", desc: DESCS["Orientaciones de la unidad"], min: 5,  presup: "async" },
  { nombre: "Videoclase",                 desc: DESCS["Videoclase"],                     min: 15, presup: "async" },
  { nombre: "Recurso interactivo",        desc: DESCS["Recurso interactivo"],            min: 15, presup: "async" },
  { nombre: "Foro",                       desc: DESCS["Foro"],                           min: 30, presup: "async" },
  { nombre: "Bibliografía obligatoria",   desc: DESCS["Bibliografía obligatoria"],       min: 60, presup: "info" },
  { nombre: "Evaluación formativa",       desc: DESCS["Evaluación formativa"],           min: MIN_FORM[0], presup: "sinc", rango: MIN_FORM },
  { nombre: "Evaluación sumativa",        desc: DESCS["Evaluación sumativa"],            min: MIN_SUM[0],  presup: "sinc", rango: MIN_SUM }
];
function mkUnit() {
  return {
    pag_manual: null,
    recursos: TPL.map(function (r) {
      return { nombre: r.nombre, desc: r.desc, min: r.min, presup: r.presup, rango: r.rango ? r.rango.slice() : null };
    })
  };
}

/* ---------- Migracion desde el formato antiguo ---------- */
function rangoDe(nombre) {
  var n = (nombre || "").toLowerCase();
  if (n.indexOf("formativa") >= 0) return MIN_FORM;
  if (n.indexOf("sumativa") >= 0) return MIN_SUM;
  return null;
}
function migrateUnit(u) {
  if (u && Array.isArray(u.recursos)) {
    return {
      pag_manual: (u.pag_manual === null || u.pag_manual === undefined || u.pag_manual === "") ? null : Number(u.pag_manual),
      recursos: u.recursos.map(function (r) {
        var rg = r.rango || rangoDe(r.nombre);
        var m = num(r.min, 0);
        if (rg) m = Math.max(m, rg[0]);   // se aplica el minimo acordado
        return { nombre: r.nombre, desc: DESCS[r.nombre] || r.desc || "", min: m, presup: r.presup || "async", rango: rg ? rg.slice() : null };
      })
    };
  }
  var o = u || {};
  return {
    pag_manual: null,
    recursos: [
      { nombre: "Orientaciones de la unidad", desc: DESCS["Orientaciones de la unidad"], min: num(o.orient, 5),      presup: "async", rango: null },
      { nombre: "Videoclase",                 desc: DESCS["Videoclase"], min: num(o.videoClase, 15), presup: "async", rango: null },
      { nombre: "Recurso interactivo",        desc: DESCS["Recurso interactivo"], min: num(o.infografia, 15), presup: "async", rango: null },
      { nombre: "Foro",                       desc: DESCS["Foro"], min: 30,                    presup: "async", rango: null },
      { nombre: "Bibliografía obligatoria",   desc: DESCS["Bibliografía obligatoria"], min: num(o.biblio, 60),     presup: "info",  rango: null },
      { nombre: "Evaluación formativa",       desc: DESCS["Evaluación formativa"], min: Math.max(num(o.formativo, 0), MIN_FORM[0]), presup: "sinc", rango: MIN_FORM.slice() },
      { nombre: "Evaluación sumativa",        desc: DESCS["Evaluación sumativa"], min: Math.max(num(o.sumativo, 0), MIN_SUM[0]),   presup: "sinc", rango: MIN_SUM.slice() }
    ]
  };
}
/* Evaluaciones a nivel de asignatura: una sola para todo el curso,
   no se multiplican por el número de unidades */
/* Recursos que valen para toda la asignatura y NO se multiplican
   por el número de unidades. Pueden ser síncronos (evaluaciones)
   o asíncronos (un foro único para el curso). */
function migrateEvals(e) {
  if (typeof e === "string") { try { e = JSON.parse(e); } catch (x) { e = []; } }
  if (!Array.isArray(e)) return [];
  return e.map(function (r) {
    var rg = r.rango || rangoDe(r.nombre);
    var m = num(r.min, 0);
    if (rg) m = Math.max(m, rg[0]);
    return { nombre: r.nombre || "Evaluación", desc: DESCS[r.nombre] || r.desc || "", min: m,
             presup: r.presup === "async" ? "async" : "sinc", rango: rg ? rg.slice() : null };
  });
}
function migrateAsig(a) {
  var uds = a.units_data;
  if (typeof uds === "string") { try { uds = JSON.parse(uds); } catch (e) { uds = []; } }
  if (!Array.isArray(uds)) uds = [];
  var n = num(a.uni, uds.length) || uds.length || 1;
  var out = [];
  for (var i = 0; i < n; i++) out.push(uds[i] ? migrateUnit(uds[i]) : mkUnit());
  return Object.assign({}, a, {
    uni: n,
    bienvenida: num(a.bienvenida, 3),
    conclusion: num(a.conclusion, 2),
    complementarios: num(a.complementarios, 0),
    examen: Math.max(num(a.examen, 0), MIN_EX[0]),
    evals_asig: migrateEvals(a.evals_asig),
    h_async: num(a.h_async, 0),
    h_apoyo: num(a.h_apoyo, 0),
    pct_nuevo: num(a.pct_nuevo, 100),
    nota: a.nota || "",
    units_data: out
  });
}

/* ---------- MOTOR DE CALCULO ---------- */
function calc(a, cfg) {
  var uds = a.units_data || [];
  var n = uds.length || 1;

  var presupProd = a.h_async * cfg.minProd;
  var presupPed  = a.h_async * cfg.minPed;
  var presupSinc = a.h_apoyo * cfg.minPed;
  var minPorUnidad = presupProd / n;

  var unidades = uds.map(function (u) {
    var fijo = 0, sinc = 0, info = 0;
    (u.recursos || []).forEach(function (r) {
      var m = num(r.min, 0);
      if (r.presup === "sinc") sinc += m;
      else if (r.presup === "info") info += m;
      else fijo += m;
    });
    var dispo = minPorUnidad - fijo;
    var pagCalc = Math.max(0, Math.round(dispo / cfg.minPag));
    var piso = num(cfg.pagMinUnidad, 0);
    var pagAuto = Math.max(pagCalc, piso);
    var pisoActivo = pagAuto > pagCalc;
    var esManual = !(u.pag_manual === null || u.pag_manual === undefined || u.pag_manual === "");
    var pag = esManual ? Math.max(0, num(u.pag_manual, pagAuto)) : pagAuto;
    return {
      fijo: fijo, sinc: sinc, info: info, dispo: dispo,
      pagAuto: pagAuto, pagCalc: pagCalc, pisoActivo: pisoActivo, pag: pag, manual: esManual,
      minCC: pag * cfg.minPag, totalAsync: fijo + pag * cfg.minPag
    };
  });

  var transvBase = num(a.bienvenida, 0) + num(a.conclusion, 0) + num(a.complementarios, 0);
  var fijoUnid = 0, minCC = 0, pagTot = 0, sincUnid = 0, infoTot = 0;
  unidades.forEach(function (u) {
    fijoUnid += u.fijo; minCC += u.minCC; pagTot += u.pag;
    sincUnid += u.sinc; infoTot += u.info;
  });

  var sincAsig = 0, asyncAsig = 0;
  (a.evals_asig || []).forEach(function (r) {
    if (r.presup === "async") asyncAsig += num(r.min, 0); else sincAsig += num(r.min, 0);
  });
  var transv = transvBase + asyncAsig;
  var hayPiso = false;
  unidades.forEach(function (u) { if (u.pisoActivo && !u.manual) hayPiso = true; });
  var consumoAsync = transv + fijoUnid + minCC;
  var consumoSinc = sincUnid + sincAsig + num(a.examen, 0);
  var pct = num(a.pct_nuevo, 100) / 100;
  var excesoMin = consumoAsync - presupPed;
  var excesoPag = excesoMin / cfg.minPag;

  return {
    n: n, unidades: unidades, minPorUnidad: minPorUnidad,
    transv: transv, fijoUnid: fijoUnid, minCC: minCC,
    pagTot: pagTot, pagProducir: Math.round(pagTot * pct),
    pantTot: pagTot * cfg.pantPorPag,
    consumoAsync: consumoAsync, consumoSinc: consumoSinc, infoTot: infoTot,
    sincUnid: sincUnid, sincAsig: sincAsig, asyncAsig: asyncAsig, hayPiso: hayPiso,
    presupProd: presupProd, presupPed: presupPed, presupSinc: presupSinc,
    pctProd: presupProd ? consumoAsync / presupProd * 100 : 0,
    pctPed:  presupPed  ? consumoAsync / presupPed  * 100 : 0,
    pctSinc: presupSinc ? consumoSinc  / presupSinc * 100 : 0,
    excesoMin: excesoMin,
    excesoHrsPed: excesoMin / cfg.minPed,
    excesoPag: excesoPag,
    excesoPagProducir: excesoPag * pct,
    excesoUsd: excesoPag * pct * cfg.usdPorPag,
    excesoSincMin: consumoSinc - presupSinc,
    totalEstudiante: consumoAsync + consumoSinc + infoTot
  };
}

var FALLBACK = [
  { id: 1, prog: "MBA", ciclo: 1, nombre: "Taller de emprendimiento", uni: 4, h_async: 15, h_apoyo: 12,
    doc: "Vanessa Nowak", bienvenida: 3, conclusion: 2, complementarios: 0, examen: 90, pct_nuevo: 100, nota: "", evals_asig: [], units_data: [] }
];

var PCOL = { MBA: "#0090F8", MCG: "#404040", MPCG: "#404040", MCEE: "#0090F8", OPT: "#666" };
var C = { azul: "#0090F8", texto: "#2A2A2A", cuerpo: "#404040", fondo: "#EBECF0", claro: "#F3F3F3", ambar: "#B45309", ambarBg: "#FEF6E7" };

/* ---------- Formato ---------- */
function hm(min) {
  var m = Math.round(min), hh = Math.floor(m / 60), mm = m % 60;
  if (hh === 0) return mm + " min";
  return hh + " h" + (mm ? " " + mm + " min" : "");
}
function hped(min, cfg) {
  var v = min / cfg.minPed;
  return (Math.round(v * 10) / 10).toString().replace(".", ",") + " h";
}

/* ---------- Componentes ---------- */
function N(p) {
  return h("input", {
    type: "number", value: (p.v === null || p.v === undefined) ? "" : p.v,
    placeholder: p.ph || "",
    onChange: function (e) { p.onChange(e.target.value === "" ? null : Number(e.target.value)); },
    style: {
      width: p.w || 52, border: "1px solid " + (p.alerta ? C.ambar : (p.accent ? C.azul : "#ddd")),
      borderRadius: 4, padding: "3px 4px", fontSize: 12, textAlign: "right",
      background: p.alerta ? C.ambarBg : (p.accent ? "#F0F8FF" : "#fff"),
      fontFamily: "inherit", fontWeight: p.accent ? 600 : 400
    }
  });
}
function Tx(p) {
  return h("input", {
    type: "text", value: p.v || "", placeholder: p.ph || "",
    onChange: function (e) { p.onChange(e.target.value); },
    style: { width: p.w || 120, border: "1px solid #ddd", borderRadius: 4, padding: "3px 6px", fontSize: 12, fontFamily: "inherit" }
  });
}
function Pill(p) {
  return h("span", { style: { fontSize: 9, color: "#fff", background: PCOL[p.prog] || "#888", borderRadius: 3, padding: "2px 6px", fontWeight: 700, whiteSpace: "nowrap" } }, p.prog);
}
function Badge(p) {
  var bg = "#D1FAE5", fg = "#065F46", lb = "OK ";
  if (p.p < 95) { bg = "#FEE2E2"; fg = "#991B1B"; lb = "Bajo "; }
  else if (p.p > 115) { bg = "#FEF3C7"; fg = "#92400E"; lb = "Excede "; }
  return h("span", { style: { background: bg, color: fg, padding: "2px 8px", borderRadius: 12, fontSize: 11, fontWeight: 600, whiteSpace: "nowrap" } }, lb + p.p.toFixed(0) + "%");
}
function BadgeRef(p) {
  return h("span", { style: { background: "#EEF2F7", color: "#475569", padding: "2px 8px", borderRadius: 12, fontSize: 11, fontWeight: 600, whiteSpace: "nowrap", border: "1px solid #DDE3EC" } }, p.p.toFixed(0) + "%");
}
function BadgeSinc(p) {
  if (p.presup > 0) return h(Badge, { p: p.p });
  if (p.consumo > 0) return h("span", { style: { background: "#FEF3C7", color: "#92400E", padding: "2px 8px", borderRadius: 12, fontSize: 10, fontWeight: 600, whiteSpace: "nowrap" } }, "Sin horas");
  return h("span", { style: { color: "#ccc", fontSize: 11 } }, "\u2014");
}
function Bar(p) {
  var col = p.p < 95 ? "#EF4444" : (p.p <= 115 ? C.azul : "#F59E0B");
  if (p.neutro) col = "#94A3B8";
  return h("div", { style: { height: 6, background: C.fondo, borderRadius: 3, position: "relative", margin: "4px 0", minWidth: 70 } },
    h("div", { style: { width: (Math.min(p.p, 160) / 1.6) + "%", height: "100%", background: col, borderRadius: 3, transition: "width .3s" } }),
    h("div", { style: { position: "absolute", left: (100 / 1.6) + "%", top: -2, width: 2, height: 10, background: C.texto, opacity: .25, borderRadius: 1 } }));
}

/* ============================================================
   APP
   ============================================================ */
function App() {
  var s1 = useState([]);             var data = s1[0], setData = s1[1];
  var s2 = useState(true);           var loading = s2[0], setLoading = s2[1];
  var s3 = useState(0);              var tab = s3[0], setTab = s3[1];
  var s4 = useState("Todos");        var fProg = s4[0], setFProg = s4[1];
  var s5 = useState("Todos");        var fCiclo = s5[0], setFCiclo = s5[1];
  var s6 = useState(null);           var open = s6[0], setOpen = s6[1];
  var s7 = useState(false);          var saving = s7[0], setSaving = s7[1];
  var s8 = useState(loadCfg());      var cfg = s8[0], setCfg = s8[1];
  var s9 = useState(false);          var cfgOpen = s9[0], setCfgOpen = s9[1];
  var s10 = useState("universidad"); var vista = s10[0], setVista = s10[1];
  var s11 = useState("");            var err = s11[0], setErr = s11[1];
  var s12 = useState("ped");         var horaProg = s12[0], setHoraProg = s12[1];
  var saveTimer = useRef(null);

  var interna = vista === "hackea";

  useEffect(function () {
    if (!sb) { setData(FALLBACK.map(migrateAsig)); setLoading(false); return; }
    sb.from("asignaturas").select("*").order("ciclo").order("prog").order("id").then(function (res) {
      if (res.error) { setErr("No se pudieron cargar los datos: " + res.error.message); setData(FALLBACK.map(migrateAsig)); }
      else if (!res.data || !res.data.length) setData(FALLBACK.map(migrateAsig));
      else setData(res.data.map(migrateAsig));
      setLoading(false);
    });
  }, []);

  useEffect(function () { saveCfg(cfg); }, [cfg]);

  /* Guardado con error visible: nunca fallar en silencio */
  var saveToDb = useCallback(function (rec) {
    if (!sb) return;
    setSaving(true);
    var r = calc(rec, cfg);
    var payload = {
      prog: rec.prog, ciclo: rec.ciclo, nombre: rec.nombre, doc: rec.doc,
      uni: rec.uni, h_async: rec.h_async, h_apoyo: rec.h_apoyo,
      bienvenida: rec.bienvenida, conclusion: rec.conclusion,
      complementarios: rec.complementarios, examen: rec.examen,
      evals_asig: rec.evals_asig,
      pct_nuevo: rec.pct_nuevo, nota: rec.nota,
      pag_clase: r.pagTot, units_data: rec.units_data,
      updated_at: new Date().toISOString()
    };
    sb.from("asignaturas").update(payload).eq("id", rec.id).then(function (res) {
      setSaving(false);
      if (res.error) setErr("No se guardó: " + res.error.message);
      else setErr("");
    });
  }, [cfg]);

  var upd = useCallback(function (id, fn) {
    setData(function (d) {
      var next = d.map(function (a) {
        if (a.id !== id) return a;
        var copy = Object.assign({}, a, {
          units_data: (a.units_data || []).map(function (u) {
            return { pag_manual: u.pag_manual, recursos: u.recursos.map(function (r) { return Object.assign({}, r); }) };
          }),
          evals_asig: (a.evals_asig || []).map(function (r) { return Object.assign({}, r); })
        });
        return fn(copy);
      });
      var ch = next.filter(function (a) { return a.id === id; })[0];
      if (ch && sb) {
        clearTimeout(saveTimer.current);
        saveTimer.current = setTimeout(function () { saveToDb(ch); }, 1500);
      }
      return next;
    });
  }, [saveToDb]);

  function setUnidades(x, v) {
    var n = Math.max(1, num(v, 1));
    var d = n - x.units_data.length;
    if (d > 0) for (var i = 0; i < d; i++) x.units_data.push(mkUnit());
    if (d < 0) x.units_data = x.units_data.slice(0, n);
    x.uni = n;
    return x;
  }

  var filtered = useMemo(function () {
    return data.filter(function (a) {
      return (fProg === "Todos" || a.prog === fProg) && (fCiclo === "Todos" || a.ciclo === Number(fCiclo));
    });
  }, [data, fProg, fCiclo]);

  var progs = [], ciclos = [];
  data.forEach(function (a) {
    if (progs.indexOf(a.prog) < 0) progs.push(a.prog);
    if (ciclos.indexOf(a.ciclo) < 0) ciclos.push(a.ciclo);
  });
  ciclos.sort();

  if (loading) return h("div", { style: { textAlign: "center", padding: 80, color: "#999", fontSize: 14 } }, "Cargando datos...");

  /* ---------- Cabecera ---------- */
  var header = h("div", { className: "no-print", style: { display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14, flexWrap: "wrap", gap: 8 } },
    h("div", { style: { display: "flex", alignItems: "center", gap: 10 } },
      h("div", { style: { width: 32, height: 32, borderRadius: "50%", border: "2.5px solid " + C.azul, display: "flex", alignItems: "center", justifyContent: "center" } },
        h("div", { style: { width: 8, height: 8, borderRadius: "50%", border: "2px solid " + C.azul } })),
      h("div", null,
        h("span", { style: { fontSize: 17, fontWeight: 700, color: C.texto, letterSpacing: .5 } }, "HACK", h("span", { style: { color: C.azul } }, "EA")),
        h("span", { style: { fontSize: 11, color: "#999", marginLeft: 8 } }, interna ? "Calculadora de Recursos" : "Estructura de la asignatura"))),
    h("div", { style: { display: "flex", alignItems: "center", gap: 10, fontSize: 11 } },
      h("div", { style: { display: "flex", border: "1px solid #ddd", borderRadius: 6, overflow: "hidden" } },
        [["universidad", "Vista Universidad"], ["hackea", "Vista Hackea"]].map(function (v) {
          return h("button", {
            key: v[0], onClick: function () { setVista(v[0]); setTab(0); },
            style: { padding: "4px 10px", fontSize: 11, border: "none", cursor: "pointer", fontFamily: "inherit",
              background: vista === v[0] ? C.azul : "#fff", color: vista === v[0] ? "#fff" : "#888", fontWeight: vista === v[0] ? 600 : 400 }
